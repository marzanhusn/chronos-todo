<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chronos To-Do</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Arial,sans-serif; }
body { background:#f4f6fb; color:#2d3748; min-height:100vh; padding:20px 15px; display:flex; justify-content:center; }
.app { width:100%; max-width:780px; background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:24px; box-shadow:0 4px 20px rgba(0,0,0,0.06); }
header { text-align:center; margin-bottom:20px; }
h1 { color:#4a5568; letter-spacing:3px; font-size:26px; }
.subtitle { font-size:11px; color:#a0aec0; letter-spacing:2px; margin-top:4px; }

.input-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
input, select, button { padding:12px 14px; border-radius:8px; font-size:14px; outline:none; font-family:inherit; border:1px solid #cbd5e0; transition:0.2s; }
#taskInput { flex:1; min-width:150px; background:#fff; color:#2d3748; }
#taskInput::placeholder { color:#a0aec0; }
#taskInput:focus { border-color:#667eea; box-shadow:0 0 0 3px rgba(102,126,234,0.15); }
select { background:#fff; color:#2d3748; cursor:pointer; }
#addBtn { background:#667eea; border:none; color:#fff; font-weight:600; cursor:pointer; padding:12px 22px; }
#addBtn:hover { background:#5568d3; box-shadow:0 4px 12px rgba(102,126,234,0.3); }

.timeline { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:22px; }
.era-card { background:#f7fafc; border:1px solid #e2e8f0; border-top:4px solid var(--color); border-radius:10px; padding:14px; cursor:pointer; text-align:center; transition:0.25s; position:relative; }
.era-card:hover { transform:translateY(-3px); box-shadow:0 6px 16px rgba(0,0,0,0.08); background:#fff; }
.era-icon { font-size:22px; display:block; margin-bottom:6px; }
.era-name { font-size:12px; letter-spacing:1px; color:var(--color); font-weight:700; }
.era-count { font-size:11px; color:#718096; margin-top:4px; }
.era-card::after { content:'Open ▸'; position:absolute; bottom:6px; right:8px; font-size:9px; color:#cbd5e0; }

h3 { color:#4a5568; font-size:13px; letter-spacing:1.5px; margin-bottom:12px; font-weight:600; }
ul { list-style:none; }
.task { display:flex; align-items:center; gap:10px; padding:12px 14px; background:#f7fafc; border-left:3px solid #667eea; border-radius:8px; margin-bottom:8px; transition:0.2s; }
.task:hover { background:#edf2f7; }
.task.done { opacity:0.6; border-left-color:#a0aec0; }
.task.done .text { text-decoration:line-through; color:#a0aec0; }
.text { flex:1; font-size:14px; color:#2d3748; }
.era-tag { font-size:10px; padding:3px 8px; border-radius:10px; font-weight:600; }
.check { width:18px; height:18px; cursor:pointer; accent-color:#667eea; }
.del { background:none; border:none; color:#e53e3e; font-size:16px; cursor:pointer; padding:0 6px; transition:0.2s; }
.del:hover { color:#c53030; transform:scale(1.2); }
.empty { text-align:center; padding:20px; color:#a0aec0; font-size:13px; background:#f7fafc; border-radius:8px; }

.stats-bar { display:flex; justify-content:space-around; gap:10px; padding:14px; margin-top:18px; background:#f7fafc; border:1px solid #e2e8f0; border-radius:10px; }
.stat-item { text-align:center; }
.stat-val { display:block; font-size:20px; color:#667eea; font-weight:700; }
.stat-label { color:#a0aec0; font-size:10px; letter-spacing:1px; margin-top:2px; }

.modal-bg { display:none; position:fixed; inset:0; background:rgba(45,55,72,0.5); justify-content:center; align-items:center; padding:20px; z-index:99; backdrop-filter:blur(3px); }
.modal-bg.show { display:flex; }
.modal { width:100%; max-width:480px; max-height:80vh; overflow-y:auto; background:#fff; border-top:5px solid var(--color); border-radius:12px; padding:22px; box-shadow:0 20px 50px rgba(0,0,0,0.2); }
.modal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid #e2e8f0; }
.modal-head h2 { font-size:16px; letter-spacing:1px; color:var(--color); font-weight:700; }
.modal-sub { font-size:10px; color:#a0aec0; letter-spacing:1px; margin-top:3px; }
.close { background:#f7fafc; border:1px solid #e2e8f0; color:#4a5568; width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:14px; transition:0.2s; }
.close:hover { background:#e2e8f0; color:#2d3748; transform:rotate(90deg); }

@media (max-width:520px) {
  h1 { font-size:20px; letter-spacing:2px; }
  .app { padding:18px; }
  .input-row { flex-direction:column; }
  #addBtn, select { width:100%; }
  .timeline { grid-template-columns:1fr 1fr; }
  .stat-val { font-size:16px; }
}
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>CHRONOS</h1>
    <div class="subtitle">▸ TIME-TRAVEL TO-DO ◂</div>
  </header>

  <div class="input-row">
    <input id="taskInput" placeholder="Enter a new task...">
    <select id="eraSelect">
      <option value="today">Today</option>
      <option value="tomorrow">Tomorrow</option>
      <option value="week">This Week</option>
      <option value="someday">Someday</option>
    </select>
    <button id="addBtn">+ Add Task</button>
  </div>

  <div class="timeline" id="timeline"></div>

  <h3>▸ ALL TASKS</h3>
  <ul id="taskList"></ul>

  <div class="stats-bar">
    <div class="stat-item"><span class="stat-val" id="statTotal">0</span><span class="stat-label">TOTAL</span></div>
    <div class="stat-item"><span class="stat-val" id="statDone">0</span><span class="stat-label">DONE</span></div>
    <div class="stat-item"><span class="stat-val" id="statPending">0</span><span class="stat-label">PENDING</span></div>
    <div class="stat-item"><span class="stat-val" id="statPct">0%</span><span class="stat-label">PROGRESS</span></div>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal">
    <div class="modal-head">
      <div>
        <h2 id="modalTitle">Today</h2>
        <div class="modal-sub" id="modalSub">0 tasks</div>
      </div>
      <button class="close" onclick="closeModal()">✕</button>
    </div>
    <ul id="modalList"></ul>
  </div>
</div>

<script>
const ERAS = {
  today:    { name:'Today',     icon:'⚡', color:'#667eea' },
  tomorrow: { name:'Tomorrow',  icon:'🌅', color:'#ed8936' },
  week:     { name:'This Week', icon:'📆', color:'#48bb78' },
  someday:  { name:'Someday',   icon:'🌌', color:'#9f7aea' }
};

let tasks = JSON.parse(localStorage.getItem('chronos')) || [];
let activeEra = null;

const input = document.getElementById('taskInput');
const eraSelect = document.getElementById('eraSelect');
const addBtn = document.getElementById('addBtn');
const timeline = document.getElementById('timeline');
const taskList = document.getElementById('taskList');
const modalBg = document.getElementById('modalBg');
const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modalTitle');
const modalSub = document.getElementById('modalSub');
const modalList = document.getElementById('modalList');

function save() { localStorage.setItem('chronos', JSON.stringify(tasks)); }

function addTask() {
  const text = input.value.trim();
  if (!text) return alert('Please type a task!');
  tasks.push({ id: Date.now(), text, era: eraSelect.value, done: false });
  input.value = '';
  save();
  render();
}

function toggle(id) {
  const t = tasks.find(t => t.id === id);
  t.done = !t.done;
  save();
  render();
  if (activeEra) openModal(activeEra);
}

function deleteTask(id) {
  tasks = tasks.filter(t => t.id !== id);
  save();
  render();
  if (activeEra) openModal(activeEra);
}

function render() {
  timeline.innerHTML = Object.keys(ERAS).map(key => {
    const era = ERAS[key];
    const count = tasks.filter(t => t.era === key).length;
    return `<div class="era-card" style="--color:${era.color}" onclick="openModal('${key}')">
      <span class="era-icon">${era.icon}</span>
      <div class="era-name">${era.name.toUpperCase()}</div>
      <div class="era-count">${count} task${count !== 1 ? 's' : ''}</div>
    </div>`;
  }).join('');

  taskList.innerHTML = tasks.length
    ? tasks.slice().reverse().map(t => {
        const era = ERAS[t.era];
        return `<li class="task ${t.done ? 'done' : ''}">
          <input type="checkbox" class="check" ${t.done ? 'checked' : ''} onchange="toggle(${t.id})">
          <span class="text">${t.text}</span>
          <span class="era-tag" style="color:${era.color};background:${era.color}20">${era.icon} ${era.name}</span>
          <button class="del" onclick="deleteTask(${t.id})">✕</button>
        </li>`;
      }).join('')
    : '<li class="empty">No tasks yet. Add one above!</li>';

  const total = tasks.length;
  const done = tasks.filter(t => t.done).length;
  const pending = total - done;
  const pct = total ? Math.round((done / total) * 100) : 0;

  document.getElementById('statTotal').textContent = total;
  document.getElementById('statDone').textContent = done;
  document.getElementById('statPending').textContent = pending;
  document.getElementById('statPct').textContent = pct + '%';
}

function openModal(eraKey) {
  activeEra = eraKey;
  const era = ERAS[eraKey];
  const list = tasks.filter(t => t.era === eraKey);
  modal.style.setProperty('--color', era.color);
  modalTitle.textContent = `${era.icon} ${era.name}`;
  modalSub.textContent = `${list.length} task${list.length !== 1 ? 's' : ''} in this timeline`;

  modalList.innerHTML = list.length
    ? list.slice().reverse().map(t => `
        <li class="task ${t.done ? 'done' : ''}">
          <input type="checkbox" class="check" ${t.done ? 'checked' : ''} onchange="toggle(${t.id})">
          <span class="text">${t.text}</span>
          <button class="del" onclick="deleteTask(${t.id})">✕</button>
        </li>`).join('')
    : '<li class="empty">No tasks in this timeline.</li>';

  modalBg.classList.add('show');
}

function closeModal() {
  modalBg.classList.remove('show');
  activeEra = null;
}

modalBg.addEventListener('click', e => { if (e.target === modalBg) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
addBtn.onclick = addTask;
input.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

render();
</script>

</body>
</html>
